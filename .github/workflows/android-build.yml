name: Build Nova AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NovaAIAssistant/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: NovaAIAssistant
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaAI-debug-apk
          path: NovaAIAssistant/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
